    <script>
        var nots = '';
        for (i=0; i < db.dados.length; i++) {
            nots += `<br><a class="link-noticia" href="${ db.dados[i].link }"><img class="imagem-noticia" height="220vw" width="270vw" src="${ db.dados[i].imagem }" alt="noticia${i}"></a> <h5 class="titulo-noticia">${ db.dados[i].titulo }</h5> <span class="data-noticia">Data: ${ db.dados[i].data }</span> <p class="corpo-noticia">${ db.dados[i].corpo }</p>`;
